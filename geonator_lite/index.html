<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geonator Lite</title>
  <meta name="description" content="geonator_lite demo — headless POI search over Mapbox datasets">

  <link rel="shortcut icon" href="https://static-assets.mapbox.com/branding/favicon/v1/favicon.ico" type="image/x-icon"/>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.11.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.11.0/mapbox-gl.js"></script>

  <!-- Turf.js (spatial calculations, used by modules/mapbox-mcp.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    /* 配色は既存のまま（アクセント#3887be・グリーン#0a5・レッド#d00・グレー階調）を
       アプリ全体で統一的に使い回すことでまとまりを出す。新しい色は足さない。 */
    :root {
      --accent: #3887be;
      --accent-dark: #2c6a94;
      --accent-soft: rgba(56, 135, 190, 0.10);
      --ink: #1f2328;
      --ink-soft: #555;
      --ink-faint: #888;
      --line: #ddd;
      --line-soft: #e5e5e5;
      --surface: #fff;
      --surface-sunken: #fafafa;
      --danger: #c00;
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      color: var(--ink);
    }
    /* 地図が画面全体を占め、検索ボックス・コンソールはその上に浮くオーバーレイになる。
       100dvhはモバイルのアドレスバー分の高さ変動に対応(未対応ブラウザは100vhのまま)。 */
    #app { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
    #map { position: absolute; inset: 0; }

    /* 地図のヘッダー：上部を全幅で埋めるバー。旧NavigationControl(ズーム/方角)の場所を引き継ぐ。
       高さを固定し、consoleToggle(ハンバーガー)をその直下に一定間隔で配置できるようにする。 */
    #mapHeader {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      height: 56px; box-sizing: border-box;
      display: flex; align-items: center;
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 0 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    /* 地図上の検索ボックス（下部中央）＋その上のAI検索/通常検索切替。
       bottomはMapboxロゴ(左下)・attribution(右下)より上に十分な余白を空ける
       (ロゴ/attributionはMapboxの利用規約上、常に視認可能でなければならず隠せない)。 */
    #searchBarWrap {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      width: min(480px, calc(100vw - 160px));
      display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10;
    }
    #searchModeToggle { align-self: center; }
    #searchBar {
      width: 100%;
      display: flex; gap: 8px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }
    #searchBar input[type="text"] {
      flex: 1 1 auto; min-width: 0; padding: 8px 10px; font-size: 14px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    #searchBar input[type="text"]:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    #searchBar button#searchBtn { flex: 0 0 auto; padding: 8px 16px; margin-top: 0; width: auto; }

    /* ハンバーガー(三本線)：コンソールの開閉トグル */
    #consoleToggle {
      position: absolute; top: 68px; right: 20px; z-index: 11;
      width: 40px; height: 40px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--line); color: var(--ink);
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }
    #consoleToggle:hover { background: var(--surface-sunken); }

    /* コンソールが開いている間の背景オーバーレイ（クリックで閉じる） */
    #consoleBackdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.25);
      opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 890;
    }
    #consoleBackdrop.open { opacity: 1; pointer-events: auto; }

    /* コンソール本体：普段は右に隠れていて、ハンバーガーを押すと迫り出してくる */
    #console {
      position: fixed; top: 0; right: 0; height: 100vh; width: 380px; max-width: 88vw;
      padding: 20px; overflow-y: auto; box-sizing: border-box;
      background: var(--surface-sunken);
      border-left: 1px solid var(--line);
      box-shadow: -6px 0 24px rgba(0,0,0,0.18);
      transform: translateX(100%); transition: transform .28s ease;
      z-index: 900;
      scrollbar-width: thin; scrollbar-color: #c9c9c9 transparent;
    }
    #console.open { transform: translateX(0); }
    #console::-webkit-scrollbar { width: 8px; }
    #console::-webkit-scrollbar-thumb { background: #c9c9c9; border-radius: 8px; }
    #console::-webkit-scrollbar-track { background: transparent; }

    h1 {
      font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 0.2px;
      display: flex; align-items: center; gap: 8px;
    }
    h1::before {
      content: ""; width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent); display: inline-block;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .row { margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    .row label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 600; }

    .row input[type="text"], .row select {
      width: 100%; padding: 8px 10px; font-size: 14px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .row input[type="text"]:focus, .row select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .row input[type="range"] { width: 100%; }

    input[type="range"], input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

    .weight-val { font-size: 11px; color: var(--ink-faint); float: right; font-variant-numeric: tabular-nums; }

    button {
      font-family: inherit; cursor: pointer; border-radius: var(--radius-sm);
      transition: background-color .15s ease, border-color .15s ease, transform .05s ease;
    }
    button:active { transform: translateY(1px); }

    button#searchBtn {
      width: 100%; padding: 10px; font-size: 14px; font-weight: 700;
      background: var(--accent); color: #fff; border: 1px solid var(--accent-dark);
      margin-top: 2px;
    }
    button#searchBtn:hover { background: var(--accent-dark); }
    button#searchBtn:disabled { background: #a9c3d4; border-color: #a9c3d4; cursor: default; }

    .btn-ghost {
      background: var(--surface); color: var(--ink-soft);
      border: 1px solid var(--line); padding: 6px 10px; font-size: 12px;
    }
    .btn-ghost:hover { background: var(--surface-sunken); border-color: #ccc; color: var(--ink); }
    .btn-ghost:disabled { color: #bbb; cursor: default; background: var(--surface); }

    /* 上位3タブ（検索結果/リクエストパラメータ/UI設定）：下線タブ型。
       「リクエストパラメータ」が長いため、狭い画面では折り返さず横スクロールにする。 */
    .settings-tabs {
      display: flex; gap: 4px; margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .settings-tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      border-radius: 0; margin-bottom: -1px; padding: 8px 10px;
      font-size: 13px; font-weight: 600; color: var(--ink-faint);
      white-space: nowrap; flex-shrink: 0;
    }
    .settings-tab-btn:hover { color: var(--ink); background: var(--surface); }
    .settings-tab-btn.active { color: var(--accent-dark); border-bottom-color: var(--accent); }

    /* GUI/JSON切替：セグメント（ピル）型。上位タブとは別物と分かるよう見た目を変える */
    .settings-modes {
      display: inline-flex; gap: 2px; padding: 3px;
      background: var(--surface-sunken); border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }
    .settings-mode-btn {
      background: none; border: none; padding: 4px 12px;
      font-size: 12px; font-weight: 600; color: var(--ink-soft); border-radius: 4px;
    }
    .settings-mode-btn:hover { color: var(--ink); }
    .settings-mode-btn.active { background: var(--accent); color: #fff; }
    .settings-mode-btn.active:hover { background: var(--accent-dark); }

    .bbox-mode-group { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .bbox-mode-group label {
      display: flex; align-items: center; gap: 7px; font-weight: 400;
      color: var(--ink); margin: 0; padding: 6px 8px; border-radius: var(--radius-sm);
      transition: background-color .15s ease;
    }
    .bbox-mode-group label:hover { background: var(--surface-sunken); }
    .bbox-mode-group input[type="number"] {
      width: 72px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; font-size: 13px;
    }

    .checkbox-row {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--ink-soft);
    }

    #proximityInfo {
      font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
      background: var(--surface-sunken); border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm); padding: 6px 9px; margin-bottom: 6px;
    }

    #results { margin-top: 4px; }
    .result-item {
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--line-soft); padding: 9px 4px; font-size: 13px; cursor: pointer;
      border-radius: var(--radius-sm); transition: background-color .12s ease;
    }
    .result-item:hover { background: var(--accent-soft); }
    .result-item:last-child { border-bottom: none; }
    .result-rank { font-weight: 700; color: var(--accent-dark); margin-right: 2px; }
    .result-score { margin-left: auto; color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 12px; }

    .meta { font-size: 11px; color: var(--ink-faint); margin-top: 8px; line-height: 1.5; }
    .error {
      color: var(--danger); font-size: 12px; margin-top: 8px; white-space: pre-wrap;
      background: rgba(204,0,0,0.06); border: 1px solid rgba(204,0,0,0.25);
      border-radius: var(--radius-sm); padding: 8px 10px;
    }

    /* proximityマーカー：ターゲット(照準)風アイコン */
    .proximity-target-marker { width: 28px; height: 28px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }

    /* 検索結果は index.js 側で circle + symbol レイヤーとして描画（zoom>=15で名前ラベル表示）。
       DOMマーカーではなくなったため、専用のCSSクラスは不要。 */

    /* 検索中の画面暗転＋スピナー。AI検索/通常検索どちらもrunSearch()実行中は表示する。 */
    #loadingOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .15s ease; z-index: 950;
    }
    #loadingOverlay.open { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.35); border-top-color: #fff;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* レスポンシブ対応：狭い画面(スマホ縦持ち想定)ではコンソールを全幅化し、
       各オーバーレイの余白・フォントサイズを詰める。 */
    @media (max-width: 600px) {
      #mapHeader { padding: 0 14px; height: 52px; }
      h1 { font-size: 15px; }
      #consoleToggle { top: 64px; right: 14px; width: 36px; height: 36px; }
      #searchBarWrap {
        width: auto; max-width: none;
        left: 14px; right: 14px; transform: none; bottom: 40px;
      }
      #console { width: 100vw; max-width: 100vw; border-left: none; padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <!-- 地図のヘッダー：上部を全幅で埋めるバー。アプリ名の表示のみ（コンソール側からは外した） -->
    <div id="mapHeader">
      <h1>Geonator Lite</h1>
    </div>

    <!-- 地図上に浮く検索ボックス。それ以外の設定/結果類はコンソール(ハンバーガーで開閉)に格納。
         AI検索(既定)=現行のL1/L2込みgeonator_lite処理、通常検索=Search Box APIへの固定パラメータ
         forwardリクエストのみ(L1もgeonator_liteのbbox/judge等も一切介さない)。 -->
    <div id="searchBarWrap">
      <div class="settings-modes" id="searchModeToggle">
        <button type="button" id="searchModeAiBtn" class="settings-mode-btn active">AI検索</button>
        <button type="button" id="searchModeNormalBtn" class="settings-mode-btn">通常検索</button>
      </div>
      <div id="searchBar">
        <input type="text" id="queryInput" placeholder="場所を探す...">
        <button id="searchBtn">検索</button>
      </div>
    </div>

    <button id="consoleToggle" type="button" aria-label="コンソールを開く/閉じる">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div id="consoleBackdrop"></div>

    <div id="loadingOverlay"><div class="spinner"></div></div>

    <div id="console">
      <!-- コンソールの中身はこの3タブが唯一の上位構造（「設定」等の親カテゴリは作らない）。
           検索結果＝結果表示・ログ記録に関わる値、リクエストパラメータ＝searchPOI()の
           requestBodyに載る値、UI設定＝地図表示等UI側だけの表示設定でリクエストには載らない。 -->
      <div class="settings-tabs">
        <button type="button" id="settingsTopTabResultBtn" class="settings-tab-btn active">検索結果</button>
        <button type="button" id="settingsTopTabRequestBtn" class="settings-tab-btn">リクエストパラメータ</button>
        <button type="button" id="settingsTopTabFrontendBtn" class="settings-tab-btn">UI設定</button>
      </div>

      <div id="settingsTabResult">
        <div class="row" style="margin-bottom:0;">
          <label class="checkbox-row" style="display:inline-flex;">
            <input type="checkbox" id="debugLogToggle" checked>
            詳細ログを記録する（L1/L2段階トレース＋個別API呼び出し）
          </label>
        </div>
        <div id="errorBox" class="error" style="display:none;"></div>
        <div id="metaBox" class="meta"></div>
        <div id="usageBox" class="meta"></div>
        <button id="logBtn" class="btn-ghost" type="button" style="margin-top:8px;" disabled>処理ログを見る</button>
        <div id="results"></div>
      </div>

      <div id="settingsTabRequest" style="display:none;">
          <div class="row" style="display:flex; align-items:center; gap:6px;">
            <div class="settings-modes">
              <button type="button" id="settingsModeGuiBtn" class="settings-mode-btn active">GUI</button>
              <button type="button" id="settingsModeJsonBtn" class="settings-mode-btn">JSON</button>
            </div>
            <button type="button" id="viewRequestBtn" class="btn-ghost" style="margin-left:auto;">リクエスト全文を見る</button>
          </div>

          <div id="settingsGuiView">
            <div class="row">
              <label>proximity（地図をクリックして指定）</label>
              <div id="proximityInfo">未指定</div>
              <button id="clearProximityBtn" class="btn-ghost" type="button">クリア</button>
            </div>
            <div class="row">
              <label for="modelSelect">モデル</label>
              <select id="modelSelect">
                <option value="claude-haiku-4-5-20251001">claude-haiku-4-5-20251001</option>
                <option value="claude-sonnet-4-6-20251015">claude-sonnet-4-6-20251015</option>
              </select>
            </div>
            <div class="row">
              <label for="wRelevance">関連性 (relevance) <span class="weight-val" id="wRelevanceVal">0.20</span></label>
              <input type="range" id="wRelevance" min="0" max="1" step="0.05" value="0.20">
            </div>
            <div class="row">
              <label for="wCondition">条件距離 (condition) <span class="weight-val" id="wConditionVal">0.70</span></label>
              <input type="range" id="wCondition" min="0" max="1" step="0.05" value="0.70">
            </div>
            <div class="row">
              <label for="wAnchor">基準点距離 (anchor) <span class="weight-val" id="wAnchorVal">1.00</span></label>
              <input type="range" id="wAnchor" min="0" max="1" step="0.05" value="1.00">
            </div>
            <div class="row">
              <label>検索範囲（bbox）</label>
              <div class="bbox-mode-group">
                <label>
                  <input type="radio" name="bboxMode" value="off"> オフ
                </label>
                <label>
                  <input type="radio" name="bboxMode" value="square">
                  オン（proximityから一辺
                  <input type="number" id="bboxSquareM" value="2000" min="100" step="100">
                  m の正方形）
                </label>
                <label>
                  <input type="radio" name="bboxMode" value="viewport"> オン（現在の画面表示領域）
                </label>
                <label>
                  <input type="radio" name="bboxMode" value="auto" checked> オート（クエリ中の到達時間/距離指定から自動計算）
                </label>
              </div>
            </div>
          </div>

          <div id="settingsJsonView" class="row" style="display:none;">
            <label for="settingsJsonInput">リクエストパラメータ JSON</label>
            <textarea id="settingsJsonInput" rows="12" spellcheck="false"
              style="width:100%; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px;
                     padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm);
                     background:var(--surface); color:var(--ink); resize:vertical;"></textarea>
            <div id="settingsJsonError" class="error" style="display:none;"></div>
          </div>
        </div>

      <div id="settingsTabFrontend" style="display:none;">
        <div class="row" style="margin-bottom:0;">
          <label class="checkbox-row" style="display:inline-flex;">
            <input type="checkbox" id="showBboxPreview">
            bboxを地図上に表示する
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- 処理ログモーダル（L1/L2間のJS処理・query schema確認用） -->
  <div id="logModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background:#fff; max-width:900px; max-height:85vh; margin:5vh auto; padding:16px 20px; overflow-y:auto; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.35);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 style="font-size:15px; margin:0; font-weight:700;">処理ログ</h2>
        <button id="logModalClose" class="btn-ghost" type="button">閉じる</button>
      </div>
      <pre id="logModalContent" style="white-space:pre-wrap; word-break:break-all; font-size:12px; line-height:1.5; font-family: ui-monospace, Menlo, Consolas, monospace;"></pre>
    </div>
  </div>

  <!-- リクエストプレビューモーダル：今「検索」を押した場合に実際に送られるrequestBody全文
       （text/proximity/実際に解決したbbox値等を含む）。読み取り専用、編集不可。 -->
  <div id="requestModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background:#fff; max-width:900px; max-height:85vh; margin:5vh auto; padding:16px 20px; overflow-y:auto; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.35);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 style="font-size:15px; margin:0; font-weight:700;">リクエスト全文（現在の設定で検索した場合に送られる内容）</h2>
        <button id="requestModalClose" class="btn-ghost" type="button">閉じる</button>
      </div>
      <div id="requestModalError" class="error" style="display:none;"></div>
      <pre id="requestModalContent" style="white-space:pre-wrap; word-break:break-all; font-size:12px; line-height:1.5; font-family: ui-monospace, Menlo, Consolas, monospace;"></pre>
    </div>
  </div>

  <!-- config -->
  <script src="./config.js"></script>
  <!-- config.local.js: gitignore対象。存在すればCONFIGをローカル上書き（local-proxy優先切替等）。 -->
  <script src="./config.local.js"></script>

  <!-- data -->
  <script src="./data/category-taxonomy.js"></script>
  <script src="./data/category-synonyms.js"></script>
  <script src="./data/poi-blocklist.js"></script>

  <!-- prompts -->
  <script src="./prompts/prompt-l1.js"></script>
  <script src="./prompts/prompt-l2.js"></script>

  <!-- modules -->
  <script src="./modules/spatial-utils.js"></script>
