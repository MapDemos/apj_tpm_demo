<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="400" height="560">
  <defs>
    <!-- マスク機能を使って、中心に完全な正円の穴を開ける -->
    <mask id="hole-mask">
      <rect width="100%" height="100%" fill="white" />
      <circle cx="100" cy="155" r="43" fill="black" />
    </mask>
  </defs>

  <!-- 外側の青いボディ -->
  <g mask="url(#hole-mask)">
    <path fill="#1F8BCA" d="
      M 100,20
      A 48,48 0 0,1 144,80
      C 144,105 160,115 160,155
      A 60,60 0 0,1 142.4,197.4
      C 120,230 105,255 100,270
      C 95,255 80,230 57.6,197.4
      A 60,60 0 0,1 40,155
      C 40,115 56,105 56,80
      A 48,48 0 0,1 100,20
      Z
    " />
  </g>

  <!-- 上部の雲と雨アイコン -->
  <g transform="translate(100, 65)">
    <!-- 雨 -->
    <line x1="-18" y1="12" x2="-23" y2="24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="-6"  y1="12" x2="-11" y2="24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="6"   y1="12" x2="1"   y2="24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="18"  y1="12" x2="13"  y2="24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- 雲 -->
    <path fill="#FFFFFF" d="
      M -18,10
      h 36
      a 10,10 0 0,0 3.2,-19.5
      a 16,16 0 0,0 -30.4,-3.5
      a 12,12 0 0,0 -8.8,23
      z
    " />
  </g>
</svg>
